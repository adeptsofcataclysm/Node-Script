kind = "web"
previewPath = "/"
title = "Russian Roulette"
version = "1.0.0"
id = "artifacts/roulette-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21085

[services.development]
run = "pnpm --filter @workspace/roulette-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roulette-game", "run", "build" ]
publicDir = "artifacts/roulette-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21085"
BASE_PATH = "/"
