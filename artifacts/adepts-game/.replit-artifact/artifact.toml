kind = "web"
previewPath = "/adepts-game/"
title = "Adepts Quiz Game"
version = "1.0.0"
id = "artifacts/adepts-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/adepts-game/" ]
localPort = 24575

[services.development]
run = "pnpm --filter @workspace/adepts-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adepts-game", "run", "build" ]
publicDir = "artifacts/adepts-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24575"
BASE_PATH = "/adepts-game/"
