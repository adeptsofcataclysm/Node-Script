kind = "web"
previewPath = "/adepts-game-3/"
title = "Самый Душный 3.0 — игра 3"
version = "1.0.0"
id = "artifacts/adepts-game-3"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/adepts-game-3/" ]
localPort = 21471

[services.development]
run = "pnpm --filter @workspace/adepts-game-3 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adepts-game-3", "run", "build" ]
publicDir = "artifacts/adepts-game-3/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21471"
BASE_PATH = "/adepts-game-3/"
