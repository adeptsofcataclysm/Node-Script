# Standalone Nginx main config for the game UI + reverse proxy to the API.
# Use with: game-frontend.service (see deploy/systemd/game-frontend.service).


user nginx;
worker_processes auto;
error_log /var/log/nginx-workspace-frontend-error.log warn;
pid /run/nginx-workspace-frontend.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 4096;

    server {
        listen 80 default_server;
        server_name _;

        root /home/adept/node_app/artifacts/game-client/dist/public;
        index index.html;

        # API
        location /api {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.io (WebSocket)
        location /socket.io/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Vite / SPA: direct URL loads for client routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
